<!doctype html>
<html lang="es-MX">
  <head>
    <style>
      body {
        background-image: url("mc/Fondo1.jpg");
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size: cover;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission Control</title>
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="envoltura">
      <form action="" method="post">
        <h1 class="iniciosesion">Mission Control</h1>
        <div class="input-box">
          <input
            type="email"
            id="correo"
            autocomplete="username"
            name="correo"
            required
          /><br />
        </div>
        <div class="input-box">
          <input
            type="password"
            id="contrasena"
            autocomplete="current-password"
            name="contrasena"
          />
          <div>
            <button type="submit" class="btn">Inicio</button>
          </div>
          <div class="recuerdame">
            <label><input type="checkbox" />Recuerdame</label>
          </div>
          <div class="registro">
            <p>En caso de no tener credenciales contacte su administrador.</p>
            <a href="#">Contactar administrador.</a>
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
