<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission Control</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="envoltura">
      <form action="" method="post">
        <h1 class="titulo">Mission Control</h1>
        <p class="subtitulo">Inicia sesión con tus credenciales</p>
        <img class="logo" src="MC/marca de la verguenza blanco.png" alt="Logo Mission Control" />

        <div class="campo">
          <label for="correo">Correo institucional</label>
          <input type="email" id="correo" name="correo" autocomplete="username" required />
        </div>

        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required />
        </div>

        <button type="submit" class="btn">Iniciar Sesión</button>

        <p class="nota">¿No tienes cuenta?, contacta al administrador del sitio.</p>
      </form>
    </div>
  </body>
</html>
